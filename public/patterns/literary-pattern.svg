<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <pattern id="literary" width="320" height="320" patternUnits="userSpaceOnUse">
      <!-- Ink splashes -->
      <ellipse cx="48" cy="52" rx="22" ry="18" fill="#D27C5A" opacity="0.12" transform="rotate(-15 48 52)"/>
      <ellipse cx="270" cy="88" rx="18" ry="24" fill="#D4A359" opacity="0.1" transform="rotate(20 270 88)"/>
      <ellipse cx="160" cy="240" rx="26" ry="20" fill="#5BA4A4" opacity="0.09" transform="rotate(8 160 240)"/>
      <ellipse cx="88" cy="200" rx="14" ry="14" fill="#D27C5A" opacity="0.08"/>
      <ellipse cx="240" cy="280" rx="20" ry="16" fill="#C06240" opacity="0.11" transform="rotate(-25 240 280)"/>
      <!-- Feather / quill -->
      <path d="M200 30 Q210 60 205 90 Q198 70 200 30" fill="#FCF9F5" opacity="0.06"/>
      <path d="M200 30 Q218 55 205 90" stroke="#D4A359" stroke-width="1.2" fill="none" opacity="0.15"/>
      <path d="M30 140 Q50 130 55 155 Q35 160 30 140" fill="#FCF9F5" opacity="0.05"/>
      <!-- Open book -->
      <rect x="120" y="100" width="28" height="20" rx="2" fill="#D27C5A" opacity="0.08" transform="rotate(-12 134 110)"/>
      <line x1="134" y1="100" x2="134" y2="120" stroke="#D4A359" stroke-width="1" opacity="0.12" transform="rotate(-12 134 110)"/>
      <rect x="260" y="160" width="24" height="18" rx="2" fill="#D4A359" opacity="0.07" transform="rotate(18 272 169)"/>
      <!-- Ink bottle -->
      <rect x="70" y="280" width="14" height="18" rx="3" fill="#2A1810" opacity="0.2"/>
      <rect x="72" y="276" width="10" height="5" rx="1" fill="#D27C5A" opacity="0.12"/>
      <!-- Small dots -->
      <circle cx="280" cy="40" r="3" fill="#D27C5A" opacity="0.15"/>
      <circle cx="40" cy="280" r="2.5" fill="#D4A359" opacity="0.12"/>
      <circle cx="150" cy="40" r="2" fill="#5BA4A4" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="320" height="320" fill="url(#literary)"/>
</svg>
